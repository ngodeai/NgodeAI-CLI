services:
  # ───────────────────────────────────────────────────────────────────────────
  # ngodebot orchestrator
  #
  # NOTE: `env_file:` is INTENTIONALLY ABSENT. We never want the gh-proxy's
  # PAT (`GITHUB_TOKEN` in .env) to leak into this container's environment.
  # Every variable below is an explicit allowlist; compose still reads `.env`
  # for `${VAR}` interpolation, but only the keys listed here flow into the
  # container. Adding a new secret means an explicit compose-level decision
  # about which container is allowed to see it.
  # ───────────────────────────────────────────────────────────────────────────
  ngodebot:
    build:
      # pi root: gives the web-builder stage access to the workspace
      # bun.lock + catalog (web/package.json refs `catalog:` versions).
      # python/ngodebot/data and pi-root excludes are filtered via
      # Dockerfile.ngodebot.dockerignore at the context root.
      context: ../..
      dockerfile: Dockerfile.ngodebot
      args:
        # Tag of the pre-built pi-base image produced by `bun run pi:image`
        # (sources: pi root /Dockerfile). Override per-environment as needed.
        NGODEAI_BASE: ngodeai/ngodeai:dev
    image: ngodebot:dev
    container_name: ngodebot
    # Stable hostname: os.hostname() inside the container feeds usage
    # attribution (x-ngode-hostname → broker `clients.hostname`); without this
    # it reports the random docker container id.
    hostname: ngodebot
    # Phase B (graceful shutdown): gives the orchestrator at least
    # NGODEBOT_SHUTDOWN_DRAIN_TIMEOUT_SECONDS + NGODEBOT_SHUTDOWN_KILL_TIMEOUT_SECONDS
    # before SIGKILL. Defaults: 25 + 5 = 30s.
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      # --- gh-proxy channel ---
      # The orchestrator NEVER holds GITHUB_TOKEN; it talks to the sibling
      # gh-proxy container over the internal-only network.
      NGODEBOT_GH_PROXY_URL: http://gh-proxy:8081
      NGODEBOT_GH_PROXY_HMAC_KEY: ${NGODEBOT_GH_PROXY_HMAC_KEY:?NGODEBOT_GH_PROXY_HMAC_KEY must be set in .env}

      # --- webhook + identity ---
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set in .env}
      NGODEBOT_BOT_LOGIN: ${NGODEBOT_BOT_LOGIN:?NGODEBOT_BOT_LOGIN must be set in .env}
      NGODEBOT_GIT_AUTHOR_NAME: ${NGODEBOT_GIT_AUTHOR_NAME:-}
      NGODEBOT_GIT_AUTHOR_EMAIL: ${NGODEBOT_GIT_AUTHOR_EMAIL:?NGODEBOT_GIT_AUTHOR_EMAIL must be set in .env}
      NGODEBOT_REPO_ALLOWLIST: ${NGODEBOT_REPO_ALLOWLIST:?NGODEBOT_REPO_ALLOWLIST must be set in .env}
      NGODEBOT_MAINTAINER_LOGINS: ${NGODEBOT_MAINTAINER_LOGINS:-}
      NGODEBOT_REVIEWER_BOTS: ${NGODEBOT_REVIEWER_BOTS:-}

      # --- PR review ---
      NGODEBOT_PR_REVIEW_ENABLED: ${NGODEBOT_PR_REVIEW_ENABLED:-true}

      # --- release sentinel ---
      NGODEBOT_RELEASE_SENTINEL_ENABLED: ${NGODEBOT_RELEASE_SENTINEL_ENABLED:-false}
      NGODEBOT_RELEASE_COMMIT_PREFIX: "${NGODEBOT_RELEASE_COMMIT_PREFIX:-chore: bump version to }"
      NGODEBOT_RELEASE_MAX_ROUNDS: ${NGODEBOT_RELEASE_MAX_ROUNDS:-5}
      NGODEBOT_RELEASE_TASK_TIMEOUT_SECONDS: ${NGODEBOT_RELEASE_TASK_TIMEOUT_SECONDS:-3600}
      NGODEBOT_RELEASE_MODEL: ${NGODEBOT_RELEASE_MODEL:-}

      # --- model selection ---
      NGODEBOT_MODEL: ${NGODEBOT_MODEL:-anthropic/claude-sonnet-4-6}
      NGODEBOT_PROVIDER: ${NGODEBOT_PROVIDER:-}
      NGODEBOT_THINKING: ${NGODEBOT_THINKING:-high}

      # --- runtime tuning ---
      NGODEBOT_MAX_CONCURRENCY: ${NGODEBOT_MAX_CONCURRENCY:-8}
      NGODEBOT_TASK_TIMEOUT_SECONDS: ${NGODEBOT_TASK_TIMEOUT_SECONDS:-2400}
      NGODEBOT_TASK_TIMEOUT_HARD_GRACE_SECONDS: ${NGODEBOT_TASK_TIMEOUT_HARD_GRACE_SECONDS:-60}
      NGODEBOT_REQUEST_TIMEOUT_SECONDS: ${NGODEBOT_REQUEST_TIMEOUT_SECONDS:-120}
      NGODEBOT_RATE_LIMIT_WINDOW_SECONDS: ${NGODEBOT_RATE_LIMIT_WINDOW_SECONDS:-3600}
      NGODEBOT_RATE_LIMIT_DEFAULT: ${NGODEBOT_RATE_LIMIT_DEFAULT:-3}
      NGODEBOT_RATE_LIMIT_CONTRIBUTOR: ${NGODEBOT_RATE_LIMIT_CONTRIBUTOR:-10}
      NGODEBOT_RATE_LIMIT_UNLIMITED: ${NGODEBOT_RATE_LIMIT_UNLIMITED:-}
      NGODEBOT_QUESTION_AUTOCLOSE_ENABLED: ${NGODEBOT_QUESTION_AUTOCLOSE_ENABLED:-true}
      NGODEBOT_QUESTION_AUTOCLOSE_HOURS: ${NGODEBOT_QUESTION_AUTOCLOSE_HOURS:-4}
      NGODEBOT_QUESTION_AUTOCLOSE_SCAN_SECONDS: ${NGODEBOT_QUESTION_AUTOCLOSE_SCAN_SECONDS:-60}
      NGODEBOT_REPLAY_TOKEN: ${NGODEBOT_REPLAY_TOKEN:-}

      # --- container-fixed paths ---
      NGODEBOT_NGODEAI_COMMAND: ngodeai
      NGODEBOT_WORKSPACE_ROOT: /data/workspaces
      NGODEBOT_SQLITE_PATH: /data/ngodebot.sqlite
      NGODEBOT_LOG_DIR: /data/logs
      NGODEBOT_BIND_HOST: ${NGODEBOT_BIND_HOST:-0.0.0.0}
      NGODEBOT_BIND_PORT: ${NGODEBOT_BIND_PORT:-8080}
      NGODEAI_ROOT: /work/pi
    depends_on:
      gh-proxy:
        condition: service_started
    # Resolve `llm-gateway.internal` (used in /srv/agent-home/.ngodeai/agent/models.yml) to the
    # Docker host. The actual gateway listens on 127.0.0.1:4000 on the host;
    # `host-gateway` is Docker's alias for the host bridge IP.
    extra_hosts:
      - "llm-gateway.internal:host-gateway"
    networks:
      - default
      - ngodebot_internal
    volumes:
      - ${NGODEAI_ROOT:-../..}:/work/pi:ro
      - ngodebot_data:/data
      # Host agent config is mounted read-only under /srv/agent-home-stage
      # with host-controlled permissions. The entrypoint copies it into
      # root-owned, world-readable files under /srv/agent-home; the agent
      # subprocess runs with HOME=/srv/agent-home, so ~/.ngodeai and ~/.agent
      # resolve there without exposing mutable host mounts.
      - ${HOME}/.ngodeai/agent/models.container.yml:/srv/agent-home-stage/.ngodeai/agent/models.yml:ro
      - ${HOME}/.agent/AGENTS.md:/srv/agent-home-stage/.agent/AGENTS.md:ro
      - ${HOME}/.agent/rules:/srv/agent-home-stage/.agent/rules:ro
    ports:
      - "0.0.0.0:6543:8080"

  # ───────────────────────────────────────────────────────────────────────────
  # gh-proxy
  #
  # The only container that ever holds GITHUB_TOKEN. Reachable only from the
  # orchestrator on the internal-only network — no host port mapping. Every
  # request must carry a valid HMAC signature (NGODEBOT_GH_PROXY_HMAC_KEY).
  # `env_file:` is INTENTIONALLY ABSENT for the same reason: the explicit
  # allowlist below is the only place where any var lands in this container.
  # ───────────────────────────────────────────────────────────────────────────
  gh-proxy:
    image: ngodebot:dev
    container_name: gh-proxy
    restart: unless-stopped
    command: ["python", "-m", "ngodebot.proxy", "serve"]
    environment:
      # PAT: lives ONLY here. The orchestrator's compose block refuses to
      # let this var into its container.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN must be set in .env}
      # Shared with the orchestrator: HMAC verification key.
      NGODEBOT_GH_PROXY_HMAC_KEY: ${NGODEBOT_GH_PROXY_HMAC_KEY:?NGODEBOT_GH_PROXY_HMAC_KEY must be set in .env}
      # The proxy reuses the SandboxManager pool layout under /data/workspaces.
      NGODEBOT_WORKSPACE_ROOT: /data/workspaces
      NGODEBOT_SQLITE_PATH: /data/ngodebot.sqlite
      NGODEBOT_LOG_DIR: /data/logs
      # Bind on the internal network only.
      NGODEBOT_GH_PROXY_BIND_HOST: 0.0.0.0
      NGODEBOT_GH_PROXY_BIND_PORT: 8081
      # Settings still requires these on construction; the proxy never uses
      # them but the validator runs the same code path as the orchestrator.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET must be set in .env}
      NGODEBOT_BOT_LOGIN: ${NGODEBOT_BOT_LOGIN:?NGODEBOT_BOT_LOGIN must be set in .env}
      NGODEBOT_GIT_AUTHOR_EMAIL: ${NGODEBOT_GIT_AUTHOR_EMAIL:?NGODEBOT_GIT_AUTHOR_EMAIL must be set in .env}
      NGODEBOT_REPO_ALLOWLIST: ${NGODEBOT_REPO_ALLOWLIST:?NGODEBOT_REPO_ALLOWLIST must be set in .env}
    networks:
      # `default` gives gh-proxy outbound NAT to api.github.com; `ngodebot_internal`
      # is how the orchestrator reaches it. No `ports:` mapping → still
      # unreachable from the host or any sibling project.
      - default
      - ngodebot_internal
    volumes:
      # Shared workspace pool/worktrees so the proxy can drive git operations
      # against the same per-issue worktrees the orchestrator builds.
      - ngodebot_data:/data

networks:
  # External-facing bridge: webhook ingress (8080) and the orchestrator's
  # outbound path to the host LLM gateway via extra_hosts.
  default: {}
  # Orchestrator <-> gh-proxy only. internal: true means no egress and no
  # ingress from outside the compose project.
  ngodebot_internal:
    internal: true

volumes:
  # Docker-managed Linux volume so UID/GID permissions on /data are enforced.
  ngodebot_data: {}
